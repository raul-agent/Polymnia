[project]
name = "polymnia"
version = "0.1.0"
description = "POLYMNIA - modular pipeline for multimodal language analysis (DaedalusLAB)"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    # Video and image processing
    "opencv-python>=4.10",
    "moviepy>=1.0.3",
    # Pose estimation (YOLOv8)
    "ultralytics>=8.3",
    # Prosodic analysis via Praat
    "praat-parselmouth>=0.4.5",
    # Data handling and storage
    "pandas>=2.2",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    # Forced alignment and transcription
    "whisperx @ git+https://github.com/m-bain/whisperx.git",
    # Declared explicitly so CUDA wheel index below applies (pins match whisperx upstream)
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "triton>=3.3.0",
]

# TalkNet-ASD is a separate checkout outside this repo (see SETUP.md).
# `uv sync --extra asd` adds what that stage needs on top of the pipeline deps.
[project.optional-dependencies]
asd = [
    # scenedetect >=0.7 ships opencv support in the base package (no [opencv] extra)
    "scenedetect>=0.6.4",
    "python_speech_features>=0.6",
    "facenet-pytorch>=2.5.3",
    "gdown>=5.1",
]

# Index matches WhisperX upstream (cu128 wheels). This machine driver is 555.42
# (CUDA 12.4) which supports CUDA 12.x runtimes via minor-version compatibility.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and platform_machine != 'AMD64' and sys_platform != 'darwin'" },
  { index = "pytorch-cu128", marker = "(platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and platform_machine != 'AMD64' and sys_platform != 'darwin'" },
  { index = "pytorch-cu128", marker = "(platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and platform_machine != 'AMD64' and sys_platform != 'darwin'" },
  { index = "pytorch-cu128", marker = "(platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform != 'darwin'" },
]
triton = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
